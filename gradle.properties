# Gradle JVM settings - max heap for the build, no daemon (cleaner for FG)
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false


## Environment Properties
# Which Minecraft/Forge/mappings we build against.
# NOTE: .properties files do NOT support trailing comments - keep comments
# on their own line or they become part of the value.

minecraft_version=1.20.1
# mods.toml: this mod works on 1.20.x only
minecraft_version_range=[1.20.1,1.21)

# Forge version - kept identical to SEM's own build target
forge_version=47.4.0
# mods.toml: needs Forge 47 or newer
forge_version_range=[47,)
# javafml loader version
loader_version_range=[47,)
# Mapping provider: parchment = official names + community parameter names/docs
mapping_channel=parchment
# Parchment release matching MC 1.20.1
mapping_version=2023.08.20-1.20.1


## Mod Properties
# Metadata substituted into mods.toml and the jar name

# Unique mod id - must match mods.toml modId and the @Mod annotation
mod_id=sem_classsystem
# Display name in the in-game mods list
mod_name=[SEM] Class System
# License - GPLv3, same as SEM (required for derivative work)
mod_license=GPLv3
# Mod version - becomes the jar filename suffix
mod_version=1.20.1-0.2.0
# Maven group id / root package
mod_group_id=com.poseidon.sem_classsystem
# Author name shown in mods.toml credits
mod_authors=Poseidon
# One-line description shown in the mods list
mod_description=An addon for Simple Enemy Mod that gives RU, US and PMC units their own attribute sets (health, speed, detection range, accuracy).
