# Forge mod descriptor - read by FML when the game loads mods.
# Placeholders get filled in by processResources from gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"


# This jar provides one mod. modId must match the Mod annotation in code.
[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

# Tells Forge to apply our mixin config file at load time.
[[mixins]]
config="${mod_id}.mixins.json"
# Xaero World Map soft-compat mixins - a second config gated by a mixin
# plugin so the feature simply never applies when the map mod is absent.
[[mixins]]
config="${mod_id}.xaero.mixins.json"

# ---- Dependencies ----
# Forge itself - obviously required.
[[dependencies.sem_classsystem]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

# Minecraft version range - 1.20.x only.
[[dependencies.sem_classsystem]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# TaCZ - SEM needs it so we need it too. Loads before us.
# Supports TaCZ 1.1.4 through the 1.1.8 line - upper bound 1.1.9 excluded so
# any 1.1.8.x hotfix still matches.
[[dependencies.sem_classsystem]]
modId="tacz"
mandatory=true
versionRange="[1.1.4,1.1.9)"
ordering="BEFORE"
side="BOTH"

# Simple Enemy Mod - mandatory hard dependency. Without it the mod refuses
# to load. BEFORE ordering so SEM classes exist before our mixins apply.
# Supports SEM 0.1.5-beta through the whole 0.1.6 line - beta, beta.N and
# beta-hotfix releases all sort below the plain 0.1.6 upper bound.
[[dependencies.sem_classsystem]]
modId="simpleenemymod"
mandatory=true
versionRange="[1.20.1-0.1.5-beta,1.20.1-0.1.6]"
ordering="BEFORE"
side="BOTH"
# GeckoLib - required: BHQ armor items are GeoItems rendered by
# GeoArmorRenderer, and SEM routes gecko armor through its own layer.
[[dependencies.sem_classsystem]]
modId="geckolib"
mandatory=true
versionRange="[4,)"
ordering="NONE"
side="BOTH"

# Xaero's World Map - OPTIONAL: unit markers, map orders and chunk claims.
# Absent installs still load everything else; the compat layer self-gates.
[[dependencies.sem_classsystem]]
modId="xaeroworldmap"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"

# Xaero's Minimap - OPTIONAL: the same unit markers on the minimap HUD.
# Registration is a lazy ModList + null gate in SemcsMinimapCompat.
[[dependencies.sem_classsystem]]
modId="xaerominimap"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="CLIENT"
